<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion Utilisateur - SkyReserve</title>

    <style>
        body {
          margin: 0;
          padding: 0;
          background: #0f172a;
          font-family: Arial, sans-serif;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          color: white;
        }

        .login-container {
          background: #1e293b;
          padding: 40px;
          border-radius: 12px;
          width: 380px;
          box-shadow: 0 0 20px rgba(0,0,0,0.4);
          text-align: center;
        }

        h2 {
          margin-bottom: 10px;
          color: #38bdf8;
        }

        p {
          font-size: 14px;
          color: #cbd5e1;
          margin-bottom: 25px;
        }

        input {
          width: 100%;
          padding: 12px;
          margin-bottom: 15px;
          border-radius: 8px;
          border: none;
          outline: none;
          background: #334155;
          color: white;
          font-size: 15px;
        }

        button {
          width: 100%;
          padding: 12px;
          background: #38bdf8;
          border: none;
          border-radius: 8px;
          color: #0f172a;
          font-size: 16px;
          font-weight: bold;
          cursor: pointer;
          transition: 0.2s;
        }

        button:hover {
          background: #0ea5e9;
        }

        #loginMessage {
          margin-top: 10px;
          font-size: 14px;
          color: #fca5a5;
          height: 20px;
        }
    </style>
</head>

<body>

<div class="login-container">
    <h2>Connexion Utilisateur</h2>
    <p>Accédez à votre espace de réservation</p>

    <!-- Compte de démonstration pour les visiteurs du portfolio -->
    <div class="demo-box" style="margin:0 0 20px;padding:12px 14px;border:1px dashed #38bdf8;border-radius:8px;background:rgba(56,189,248,0.08);font-size:13px;line-height:1.6;text-align:left;color:#cbd5e1;">
        <strong style="color:#38bdf8;">Compte de démonstration</strong><br>
        Courriel : demo@skyreserve.ca<br>
        Mot de passe : demo1234
        <button type="button" onclick="document.getElementById('email').value='demo@skyreserve.ca';document.getElementById('password').value='demo1234';"
                style="display:block;width:auto;margin-top:8px;padding:6px 12px;font-size:13px;">Remplir automatiquement</button>
    </div>

    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Mot de passe">

    <button onclick="loginUtilisateur()">Se connecter</button>

    <div id="loginMessage"></div>
    <div style="text-align:center; margin-top:20px;">
        <span>Vous n'avez pas de compte ?</span>
        <a href="inscriptionUtilisateur.html"
           style="color:blue; font-weight:bold; text-decoration:none;">
            Créer un compte
        </a>
    </div>
</div>



<!-- IMPORTANT : chemin corrigé -->
<script src="assets/js/config.js"></script>
<script src="assets/js/utilisateurAuth.js"></script>

</body>
</html>
