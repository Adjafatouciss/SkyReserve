<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Admin</title>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>Connexion Admin</h1>
    <p>Accède à la plateforme complète de gestion des administrateurs, utilisateurs, compagnies, avions, aéroports, vols, réservations, billets et paiements.</p>
    <!-- Compte de démonstration pour les visiteurs du portfolio -->
    <div class="demo-box" style="margin:0 0 20px;padding:12px 14px;border:1px dashed #7c3aed;border-radius:8px;background:rgba(124,58,237,0.10);font-size:13px;line-height:1.6;text-align:left;color:inherit;">
        <strong style="color:#7c3aed;">Compte de démonstration</strong><br>
        Courriel : admin@skyreserve.ca<br>
        Mot de passe : demo1234
        <button type="button" onclick="document.getElementById('email').value='admin@skyreserve.ca';document.getElementById('password').value='demo1234';"
                style="display:block;width:auto;margin-top:8px;padding:6px 12px;font-size:13px;">Remplir automatiquement</button>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="admin@email.com">
    </div>
    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>
    <button class="btn btn-primary full" onclick="loginAdmin()">Se connecter</button>
    <p id="loginMessage" class="message"></p>
  </div>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
