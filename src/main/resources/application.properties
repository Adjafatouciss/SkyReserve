spring.application.name=Reservation_Billets1

# Base de données : MySQL en local par défaut ; en ligne, DB_URL pointe vers PostgreSQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/r_Billets}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
# Pas de dialecte imposé : Hibernate détecte tout seul MySQL (local) ou PostgreSQL (en ligne)

# Le port est imposé par l'hébergeur en ligne (variable PORT), 8080 en local
server.port=${PORT:8080}
spring.web.resources.static-locations=classpath:/static/
server.servlet.context-path=/Reservation_Billets

# Données de démonstration (vols, compte de test) créées au démarrage si la base est vide
app.demo-data=${DEMO_DATA:false}
